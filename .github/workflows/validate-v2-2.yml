name: Validate V2.2 data

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_v2_2.py"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_v2_2.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_v2_2.py
