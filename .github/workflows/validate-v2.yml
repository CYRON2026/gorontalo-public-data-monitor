name: Validate V2 data snapshot

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate-v2.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_v2.py
