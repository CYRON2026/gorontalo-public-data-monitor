name: V2.2 Safe Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check public sources
        run: python scripts/auto_sync.py
      - name: Validate snapshot
        run: python scripts/validate_v2_2.py
      - name: Commit source-check status only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto_sync_status.json
          git diff --cached --quiet || git commit -m "chore: refresh public source status"
          git push
