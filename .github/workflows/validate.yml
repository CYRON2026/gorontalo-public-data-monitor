name: Validate data

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON and hierarchy
        run: python -B scripts/validate.py
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Reject build/cache artifacts
        run: |
          ! find . -type f \( -name '*.pyc' -o -name '*.pyo' \) | grep -q .
          ! find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.mypy_cache' \) | grep -q .
