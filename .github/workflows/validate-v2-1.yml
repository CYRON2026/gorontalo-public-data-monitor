name: Validate V2.1 data

on:
  push:
    paths:
      - 'data/v2.1-data.json'
      - 'scripts/validate_v2_1.py'
  pull_request:
    paths:
      - 'data/v2.1-data.json'
      - 'scripts/validate_v2_1.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_v2_1.py
